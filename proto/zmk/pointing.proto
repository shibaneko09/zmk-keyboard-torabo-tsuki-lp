syntax = "proto3";

package zmk.pointing;

message Settings {
    uint32 cursor_scale_milli = 1;
    uint32 scroll_scale_milli = 2;
    bool invert_scroll_x = 3;
    bool invert_scroll_y = 4;
}

message Request {
    oneof request_type {
        bool get_settings = 1;
    }
}

message Response {
    oneof response_type {
        Settings get_settings = 1;
    }
}
